name: Tests obligatoires

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  tests-obligatoires:
    name: tests-obligatoires
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Recuperer le code
        uses: actions/checkout@v4

      - name: Installer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Verifier la syntaxe du Worker
        run: node --check worker/index.js

      - name: Executer les tests
        run: npm test

      - name: Construire et valider le Worker
        run: npm run build
