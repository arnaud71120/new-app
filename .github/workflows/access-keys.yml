name: Renouveler les clés publiques Access
on:
  schedule:
    - cron: '17 4 * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: access-public-keys
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Lire uniquement le JWKS officiel épinglé
        run: node scripts/refresh-access-jwks.mjs
      - run: npm test
      - run: npm run build
      - name: Publier les seules clés publiques après validation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add worker/access-jwks.js
          git diff --cached --quiet && exit 0
          git commit -m "chore: refresh pinned Access public verification keys"
          git push origin HEAD:main
